name: Desktop builds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
            executable: build/desktop/native/MazeForge
          - os: windows-latest
            label: windows-x64
            executable: build/desktop/native/MazeForge.exe
          - os: macos-15
            label: macos-arm64
            executable: build/desktop/native/MazeForge.app/Contents/MacOS/MazeForge
          - os: macos-15-intel
            label: macos-x64
            executable: build/desktop/native/MazeForge.app/Contents/MacOS/MazeForge
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned desktop bundler
        run: python -m pip install pyinstaller==6.22.3
      - name: Build platform download from allowlisted files
        run: python tools/build_desktop.py
      - name: Verify bundled app without Python on PATH
        run: python tools/smoke_desktop.py "${{ matrix.executable }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.label }}
          path: dist/desktop/*
          if-no-files-found: error

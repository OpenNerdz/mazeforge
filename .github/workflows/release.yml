name: Release

# Publishes a validated version (docs/RELEASING.md). Run it from the Actions tab once Checks and Desktop builds have
# passed for the commit that set the version: it takes the five archives from exactly those runs, writes one
# combined SHA256SUMS.txt, tags that commit, checks a draft release, then publishes it as the Latest release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, exactly as in package.json (for example 2.0.1-beta.3)
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      ACTOR: ${{ github.actor }}
      ACTOR_ID: ${{ github.actor_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Find the commit that set this version and its passing builds
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]] || { echo "::error::Not a version: $VERSION"; exit 1; }
          # the oldest commit on main that changed this version string is the one that introduced it
          sha=$(git log --reverse --format=%H -S"\"version\": \"$VERSION\"" origin/main -- package.json | sed -n 1p)
          [ -n "$sha" ] && [ "$(git show "$sha:package.json" | jq -r .version)" = "$VERSION" ] || { echo "::error::No commit on main sets version $VERSION"; exit 1; }
          ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null || { echo "::error::Tag v$VERSION already exists"; exit 1; }
          passed() { gh run list --workflow "$1" --commit "$sha" --status success --limit 1 --json databaseId -q '.[0].databaseId'; }
          checks=$(passed test.yml) desktop=$(passed desktop.yml)
          [ -n "$checks" ] && [ -n "$desktop" ] || { echo "::error::Checks and Desktop builds must both pass for ${sha:0:7} first"; exit 1; }
          [ -f ".github/release-notes/v$VERSION.md" ] || { echo "::error::Add .github/release-notes/v$VERSION.md first"; exit 1; }
          { echo "SHA=$sha"; echo "CHECKS=$checks"; echo "DESKTOP=$desktop"
            echo "TITLE=MazeForge $(sed -E 's/-([a-z]+)\.([0-9]+)$/ \u\1 \2/' <<<"$VERSION")"; } >> "$GITHUB_ENV"
          echo "Releasing $VERSION from ${sha:0:7}: Checks run $checks, Desktop builds run $desktop"

      - name: Collect the five archives and one checksum manifest
        run: |
          set -euo pipefail
          gh run download "$CHECKS" -n mazeforge-release -D dl/source
          gh run download "$DESKTOP" -p 'desktop-*' -D dl/desktop
          # each build's own checksum must still match what it uploaded
          find dl -name '*.sha256' -o -name SHA256SUMS.txt | while read -r sums; do (cd "$(dirname "$sums")" && sha256sum -c "$(basename "$sums")") || exit 1; done
          mkdir assets
          for name in "mazeforge-$VERSION.zip" "mazeforge-$VERSION-windows-x64.zip" "mazeforge-$VERSION-macos-arm64.zip" \
                      "mazeforge-$VERSION-macos-x64.zip" "mazeforge-$VERSION-linux-x64.tar.gz"; do
            found=$(find dl -type f -name "$name")
            [ "$(grep -c . <<<"$found")" = 1 ] || { echo "::error::Expected exactly one $name"; exit 1; }
            cp "$found" assets/
          done
          (cd assets && sha256sum mazeforge-* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Tag the validated commit
        run: |
          set -euo pipefail
          git config user.name "$ACTOR"
          git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"
          git tag -a "v$VERSION" "$SHA" -m "$TITLE"
          git push origin "refs/tags/v$VERSION"

      - name: Create a draft release and check what it serves
        run: |
          set -euo pipefail
          sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{COMMIT}}/${SHA:0:7}/g" -e "s/{{CHECKS_RUN}}/$CHECKS/g" \
              -e "s/{{DESKTOP_RUN}}/$DESKTOP/g" ".github/release-notes/v$VERSION.md" > notes.md
          gh release create "v$VERSION" --verify-tag --draft --title "$TITLE" --notes-file notes.md assets/*
          gh release download "v$VERSION" -D check
          [ "$(ls check | wc -l)" = 6 ] || { echo "::error::The draft should hold five archives and SHA256SUMS.txt"; exit 1; }
          (cd check && sha256sum -c SHA256SUMS.txt)

      - name: Publish as the Latest release
        run: |
          set -euo pipefail
          gh release edit "v$VERSION" --draft=false --prerelease=false --latest
          [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = "v$VERSION" ]
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
